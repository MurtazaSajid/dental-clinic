{% extends "base.html" %}
{% block content %}
<section class="wrap narrow">
  <h2>Book an Appointment</h2>
  <form method="post" class="form">
    <label>Full name<input name="name" required></label>
    <div class="row">
      <label>Phone<input name="phone" required></label>
      <label>Email<input type="email" name="email"></label>
    </div>
    <label>Service
      <select name="service" required>
        {% for name, desc, icon in services %}<option>{{ name }}</option>{% endfor %}
      </select>
    </label>
    <div class="row">
      <label>Date<input type="date" name="date" required></label>
      <label>Time
        <select name="time" required>
          {% for t in ["09:00","10:00","11:00","12:00","14:00","15:00","16:00","17:00","18:00","19:00"] %}
          <option>{{ t }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <label>Message (optional)<textarea name="message" rows="3"></textarea></label>
    <button class="btn">Confirm Booking</button>
  </form>
</section>
{% endblock %}
