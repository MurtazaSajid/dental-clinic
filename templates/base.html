<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightSmile Dental Clinic</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="wrap nav">
    <a class="logo" href="/">🦷 BrightSmile</a>
    <nav>
      <a href="/">Home</a>
      <a href="/#services">Services</a>
      <a href="/appointments">Appointments</a>
      <a class="btn small" href="/book">Book Now</a>
    </nav>
  </div>
</header>
{% with msgs = get_flashed_messages() %}
  {% if msgs %}<div class="wrap"><div class="flash">{{ msgs[0] }}</div></div>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
<footer>
  <div class="wrap">
    <p>BrightSmile Dental Clinic · Mon–Sat 9:00 AM – 8:00 PM · 📞 +92 300 0000000</p>
    <p class="muted">Demo project: Docker &amp; Jenkins on AWS EC2</p>
  </div>
</footer>
</body>
</html>
